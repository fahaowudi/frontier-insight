name: Build & Deploy

on:
  push:
    branches: [main]
    paths:
      [
        "content/digests/**",
        "src/**",
        "config/**",
        "scripts/**",
        "package.json",
        "package-lock.json",
        ".github/workflows/build-deploy.yml",
      ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - run: npm run build
        env:
          SITE_URL: https://frontierinsight.dev
      - name: Generate search index
        run: npx pagefind --site out --output-path public/pagefind
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out
      - uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: frontier-insight
          directory: out
